id: neuroprosthetics
title: I want to work on neuroprosthetics
audience: Biomedical, robotics, neuroscience and engineering learners interested in
  assistive or restorative systems.
prerequisites:
- neuroscience-basics
- math-linear-algebra
- python-scientific
destination_outcomes:
- "Model the sensing\u2013inference\u2013control\u2013actuation loop and its failure\
  \ modes."
- Evaluate latency, uncertainty and user override in a simulated assistive system.
- Distinguish research demonstrations from clinically validated devices.
estimated_hours:
  explorer: "10\u201318"
  builder: "100\u2013160"
  researcher: "220\u2013400+"
