starting_assumptions:
- You can follow basic programming and quantitative reasoning.
- The default work is simulation and public data.
minimum_viable_path: Build a simulated intent-to-actuation loop with explicit idle,
  uncertain and manual-override states and measure control latency.
deeper_path: Study modality-specific devices, adaptation, long-term stability, human
  factors, clinical endpoints and regulatory evidence.
common_misconceptions:
- A good decoder is not automatically a validated assistive device.
- Clinical usefulness requires evidence beyond an offline algorithm benchmark.
typical_failure_modes:
- Bypassing human-factors analysis, treating uncertain intent as ground truth, and
  ignoring drift or maintenance burden.
safety: Keep self-directed work in simulation and public datasets. Implantation, stimulation,
  patient-facing devices and clinical evaluation require qualified settings.
ethics: Treat user agency, informed consent, accessibility, maintenance burden and
  benefit/risk as system requirements.
research_directions:
- Long-term stability, multimodal decoding, shared control, adaptation, embodiment
  and real-world robustness.
next_steps: Choose a sensing modality branch or move deeper into robotics/control
  and translational evidence.
