id: neural-interfaces
title: I want to build neural interfaces
audience: Software, electronics, embedded and biomedical learners who want to integrate
  neural sensing with feedback and control.
prerequisites:
- neuroscience-basics
- math-linear-algebra
- python-scientific
destination_outcomes:
- Specify a bounded interface from sensing to user feedback.
- Trace timing, uncertainty and failure modes across the system.
- Build a software-only prototype that exposes state, confidence and safe stop behavior.
estimated_hours:
  explorer: "8\u201315"
  builder: "90\u2013150"
  researcher: "180\u2013300+"
core_path:
- neuroscience-basics
- physiology-neural
