- dataset-dandi
resources:
- software-brainflow
- software-openbci
- software-mne
starting_assumptions:
- The core path stays in simulation or public-data replay; hardware is treated as
  an engineering reference, not a clinical device.
minimum_viable_path: Implement a replayable software interface with timestamps, confidence,
  explicit states and a manual override.
deeper_path: Add real-time constraints, fault injection, multimodal sensing, adaptive
  control and formalized human-factors evaluation.
common_misconceptions:
- A prototype that produces the desired output once is not evidence that the system
  is safe or robust.
typical_failure_modes:
- Directly mapping uncertain model output to actuation, hiding state transitions,
  and failing to log timing or recovery behavior.
safety: Do not use this path to justify clinical, invasive or stimulation experiments.
  Physical interfaces require appropriate engineering and safety review.
ethics: User control, consent, accessibility, data minimization and recovery from
  erroneous system decisions should be explicit design concerns.
research_directions:
- Closed-loop adaptation, multimodal interfaces, uncertainty-aware control, low-latency
  systems and robust human-machine interaction.
next_steps: Branch into BCI, robotics/control or neuroprosthetics according to the
  intended sensing and actuation problem.
