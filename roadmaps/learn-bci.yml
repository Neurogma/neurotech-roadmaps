starting_assumptions:
- Basic algebra and one programming language help, but the default path fills the
  main gaps.
- Use public datasets and simulation rather than collecting data.
minimum_viable_path: Reach EEG preprocessing, PSD analysis and a transparent decoder
  on public data with subject-aware evaluation; stop there before adding deep learning.
deeper_path: Add multiple paradigms, cross-session/cross-subject evaluation, uncertainty,
  adaptive interaction and primary-literature critique.
common_misconceptions:
- BCI is not synonymous with reading thoughts; the decoder is trained for a defined
  target under defined conditions.
- Within-subject accuracy is not evidence of generalization to new people.
typical_failure_modes:
- Leakage through preprocessing or split design, unclear event definitions, and treating
  a classifier score as a system-level performance measure.
safety: Use public data and simulation. Invasive or clinical BCI work requires appropriate
  professional, institutional and regulatory structures.
ethics: Keep autonomy, agency, accessibility, participant burden and neural-data governance
  explicit when evaluating a BCI.
research_directions:
- Cross-subject generalization, calibration reduction, uncertainty, adaptive BCIs,
  multimodal interfaces and long-term robustness.
next_steps: Use the 12-week plan as the builder entry point, then choose a P300, SSVEP
  or motor-imagery branch.
