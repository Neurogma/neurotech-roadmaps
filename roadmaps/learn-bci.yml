id: learn-bci
title: I want to learn BCI
audience: Learners who want an end-to-end, non-clinical understanding of BCI systems,
  with EEG as the main entry modality.
prerequisites:
- neuroscience-basics
- python-scientific
- math-linear-algebra
destination_outcomes:
- "Explain the sensing\u2013decoding\u2013feedback loop and its assumptions."
- Build and evaluate a reproducible non-clinical EEG decoder.
- Read BCI studies by task, data, evaluation design and limitations.
estimated_hours:
  explorer: "8\u201315"
  builder: "90\u2013140"
  researcher: "180\u2013300+"
