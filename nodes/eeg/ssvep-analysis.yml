id: ssvep-analysis
title: SSVEP analysis
domain: EEG
level: advanced
description: Steady-state visual evoked potential analysis using stimulus-frequency
  reasoning, spectral features and task-aware validation.
learning_objectives:
- Explain why periodic stimulation can produce spectral responses at related frequencies.
- Extract frequency-domain features tied to a defined stimulus design.
- Evaluate a multi-class classifier with subject-aware splits.
prerequisites:
- eeg-preprocessing
- neural-decoding
estimated_hours: "20\u201335"
resources:
- dataset-bci-competition-ii
evidence:
- notebook
- reproducible_experiment
- explanation
common_misconceptions:
- A spectral peak proves the participant consciously perceived the stimulus.
exercise: Compare spectral peaks at stimulus frequencies and harmonics using a controlled
  public dataset.
