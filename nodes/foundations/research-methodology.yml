id: research-methodology
title: Research methodology
domain: research-methodology
level: foundation
description: Question formulation, study design, measurement validity, preregistration
  concepts, reporting and critical appraisal.
learning_objectives:
- Translate an engineering idea into a testable research question.
- Identify confounds, measurement validity issues and selection effects.
- Describe what evidence would change a conclusion.
