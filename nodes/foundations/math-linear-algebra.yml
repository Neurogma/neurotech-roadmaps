id: math-linear-algebra
title: Linear algebra for neurotechnology
domain: mathematics
level: foundation
description: Vectors, matrices, projections, covariance, eigenvectors and decompositions
  used throughout signal processing and machine learning.
learning_objectives:
- Manipulate vectors and matrices used to represent multichannel data.
- Interpret covariance and eigenstructure geometrically.
- Recognize when dimensionality reduction changes representation rather than creating
  information.
