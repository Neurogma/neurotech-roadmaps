id: deep-learning
title: Deep learning for neural data
domain: deep-learning
level: advanced
description: Representation learning, temporal models, regularization, optimization
  and careful validation for larger neural datasets.
learning_objectives:
- Implement a small temporal neural network with a transparent baseline.
- Explain parameter count, regularization and overfitting.
- Design subject-aware validation and report uncertainty across runs.
